# コモンズの GitHub の AI（@claude）の本体。各コモンズのリポジトリから呼び出して使う。
# Discord の AI（discord-ai-member）と同じ「ふるまい」と「覚えていること」を読むので、
# どちらの入口から呼んでも同じ AI として答える。仕組みは tools/ai-member/README.md。
name: github-ai-member

on:
  workflow_call:
    inputs:
      member_repo:
        description: ふるまいと覚えていることを置いたリポジトリ（空なら呼び出し側）
        type: string
        default: ""
      member_dir:
        description: その中のフォルダ（member.md・memory.md・config.json）
        type: string
        default: discord
      model:
        type: string
        default: claude-sonnet-5-5
      max_turns:
        type: number
        default: 40
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  reply:
    # @claude と書かれたときだけ動く（書き込み権限のある人の呼びかけだけに答えるのは action 側で確かめる）
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ふるまい・覚えていること・スキルをそろえる
        id: prep
        env:
          MEMBER_REPO: ${{ inputs.member_repo || github.repository }}
          MEMBER_DIR: ${{ inputs.member_dir }}
          MODEL: ${{ inputs.model }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail
          # 作業中のリポジトリに混ざらないよう、作業場所の外に置く
          G="$RUNNER_TEMP/ground"
          git clone -q --depth 1 https://github.com/commons-ground/ground "$G"
          if [ "$MEMBER_REPO" = "$GITHUB_REPOSITORY" ]; then
            M="$GITHUB_WORKSPACE"
          else
            M="$RUNNER_TEMP/member"
            git clone -q --depth 1 "https://github.com/$MEMBER_REPO" "$M"
          fi
          D="$M/$MEMBER_DIR"
          P="$RUNNER_TEMP/ai-member-prompt.md"
          cat "$D/member.md" > "$P"
          if [ -f "$D/memory.md" ]; then
            printf '\n\n' >> "$P"; cat "$D/memory.md" >> "$P"
          fi
          printf '\n\n' >> "$P"
          sed "s|{{MEMBER_PATH}}|$MEMBER_REPO の $MEMBER_DIR/memory.md|g" "$G/tools/ai-member/github.md" >> "$P"
          # スキル：呼び出し側・記憶の置き場・ground のマーケットプレイスから全部入れる。
          # （--plugin-dir は action の claude_args では最後の1つしか残らないので使わない）
          MK=""; PL=""; NAMES=""
          for root in "$GITHUB_WORKSPACE" "$M" "$G"; do
            f="$root/.claude-plugin/marketplace.json"
            [ -f "$f" ] || continue
            name=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["name"])' "$f")
            case " $NAMES " in *" $name "*) continue;; esac
            NAMES="$NAMES $name"
            MK="$MK$root"$'\n'
            PL="$PL$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print("\n".join(p["name"]+"@"+d["name"] for p in d["plugins"]))' "$f")"$'\n'
          done
          {
            echo "args=--model $MODEL --max-turns $MAX_TURNS --append-system-prompt-file $P --allowedTools WebSearch,WebFetch"
            echo "marketplaces<<EOF"; printf '%s' "$MK"; echo "EOF"
            echo "plugins<<EOF"; printf '%s' "$PL"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf '読み込むプラグイン：\n%s' "$PL"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: ${{ steps.prep.outputs.args }}
          plugin_marketplaces: ${{ steps.prep.outputs.marketplaces }}
          plugins: ${{ steps.prep.outputs.plugins }}

      - name: 失敗したら、Claude が返したエラーだけを見せる（質問や答えの中身は出さない）
        if: failure()
        env:
          OUT: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -n "$OUT" ] && [ -f "$OUT" ] || { echo "実行の記録がない"; exit 0; }
          python3 - "$OUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          for m in data if isinstance(data, list) else [data]:
              if isinstance(m, dict) and m.get("type") == "result" and m.get("is_error"):
                  print("エラー：", str(m.get("result") or m.get("errors") or "")[:500])
          PY
