# 篩（ふるい）の仕事の本体。各コモンズのリポジトリから呼び出して使う。
# 提案の出来事（Discord の /propose・「コモンズに提案」、#提案 に直接書いた発言、提案の Issue、カードへのコメント）が1つ起きるたびに1回だけ動き、
# core:sieve の手順で、まとめる → 一般化する → 影響で振り分ける → 入れる・取り下げる、を1件ぶん進める。
# 定期実行は足さない。#提案 に直接書いた発言は、すでに毎分 Discord を見ている中継（tools/discord-agents）が見つけて sieve-intake で起こす。
# 見直しの日が過ぎた試行は、この仕事が動くたびについでに見る。
# 篩の係（Claude）の書き込みは、すべて tools/sieve/safe.py の門を通る（個人や事業の情報・鍵の値を機械で点検してから書く）。
# 仕組みは tools/sieve/README.md、設計は docs/sieve.md。
name: sieve

on:
  workflow_call:
    inputs:
      member_dir:
        description: 呼び出し側の設定フォルダ（config.json の sieve_channel を読む）
        type: string
        default: discord
      model:
        type: string
        default: claude-sonnet-5-5
      max_turns:
        type: number
        default: 40
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      DISCORD_BOT_TOKEN:
        required: false

jobs:
  sieve:
    # 提案の出来事だけで動く。篩自身が作ったカードやコメントでは動かない（往復を防ぐ）
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.type != 'Bot' && (contains(github.event.issue.labels.*.name, '篩') || startsWith(github.event.issue.title, '〔提案〕'))) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.issue.labels.*.name, '篩') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # 同じリポジトリの篩は1つずつ動かす（重なりの判定がぶつからないように）
      group: sieve-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: 合鍵を伏せ字にする
        if: github.event_name == 'repository_dispatch'
        env:
          TOKEN: ${{ github.event.client_payload.token }}
        run: '[ -n "$TOKEN" ] && echo "::add-mask::$TOKEN" || true'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 出来事・手順・スキルをそろえる
        id: prep
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH_JSON: ${{ github.event_path }}
          MEMBER_DIR: ${{ inputs.member_dir }}
          MODEL: ${{ inputs.model }}
          MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail
          G="$RUNNER_TEMP/ground"
          git clone -q --depth 1 https://github.com/commons-ground/ground "$G"
          mkdir -p .sieve
          echo ".sieve/" >> .git/info/exclude
          # 出来事を、篩に要る項目だけにして渡す（合鍵は渡さない）
          case "$EVENT_NAME" in
            repository_dispatch)
              # sieve-intake は中継が #提案 の発言を見つけたとき、discord-propose は /propose・「コモンズに提案」
              jq '{kind: (if .action == "sieve-intake" then "discord-message" else "discord-propose" end), text: .client_payload.text, proposer: .client_payload.user_name, author: (.client_payload.source_author // .client_payload.user_name), link: (.client_payload.source_link // ""), channel_id: (.client_payload.channel_id // ""), message_id: (.client_payload.message_id // "")}' "$EVENT_PATH_JSON" > .sieve/event.json ;;
            issues)
              jq '{kind: "issue-opened", number: .issue.number, url: .issue.html_url, title: .issue.title, body: .issue.body, proposer: .issue.user.login}' "$EVENT_PATH_JSON" > .sieve/event.json ;;
            issue_comment)
              jq '{kind: "issue-comment", number: .issue.number, url: .issue.html_url, title: .issue.title, comment: .comment.body, commenter: .comment.user.login}' "$EVENT_PATH_JSON" > .sieve/event.json ;;
          esac
          CH=""
          [ -f "$MEMBER_DIR/config.json" ] && CH=$(jq -r '.sieve_channel // ""' "$MEMBER_DIR/config.json")
          echo "SIEVE_CHANNEL=$CH" >> "$GITHUB_ENV"
          echo "SIEVE_TOOLS=$G/tools/sieve" >> "$GITHUB_ENV"
          MK=""; PL=""; NAMES=""
          for root in "$GITHUB_WORKSPACE" "$G"; do
            f="$root/.claude-plugin/marketplace.json"
            [ -f "$f" ] || continue
            name=$(jq -r .name "$f")
            case " $NAMES " in *" $name "*) continue;; esac
            NAMES="$NAMES $name"
            MK="$MK$root"$'\n'
            PL="$PL$(jq -r --arg m "$name" '.plugins[].name + "@" + $m' "$f")"$'\n'
          done
          {
            # gh と git は、読むことと手元の操作だけ。公開の場所に書くのは safe.py の門だけ（点検してから書く）。
            # 外に文を出せる道（WebSearch など）は渡さない
            GHR="Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh search:*),Bash(gh label list:*)"
            GIT="Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(git revert:*)"
            echo "args=--model $MODEL --max-turns $MAX_TURNS --append-system-prompt-file $G/tools/sieve/agent.md --allowedTools $GHR,$GIT,Bash(python3 $G/tools/sieve/safe.py:*),Read,Write,Edit,Glob,Grep"
            echo "marketplaces<<EOF"; printf '%s' "$MK"; echo "EOF"
            echo "plugins<<EOF"; printf '%s' "$PL"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Discord の中継（GitHub アプリ Commons Agents）が送る repository_dispatch を通す。discord-agent.yml と同じ
          allowed_bots: commons-agents
          claude_args: ${{ steps.prep.outputs.args }}
          plugin_marketplaces: ${{ steps.prep.outputs.marketplaces }}
          plugins: ${{ steps.prep.outputs.plugins }}
          prompt: |
            篩の仕事です。.sieve/event.json の出来事を、core:sieve の手順で1件ぶん進めてください。
            手順と決まりは、システムプロンプトの「篩の仕事」にあります。

      - name: '#提案 に直接書いた発言なら、その発言に篩のカードを返す'
        if: always() && github.event_name == 'repository_dispatch' && github.event.action == 'sieve-intake'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CH: ${{ github.event.client_payload.channel_id }}
          MSG: ${{ github.event.client_payload.message_id }}
          REPLY_JQ: '{"小":"ちいさめの直しだね、そのまま入れとくよ 👍","中":"ちゅうくらい！しばらくためしてみよ 🧪","大":"おおきめ！みんなで見てほしいやつ 👀","差し戻す":"これはじぶん用のメモにしとこ 🙏","知識":"ちしきのほうに入れとくね 📚","保留":"いったんおやすみ 💤"} as $t | "🧺 ふるいにかけたよ〜！ " + ($t[.tier // ""] // (.tier // "")) + "\n" + (.summary // "") + "\n" + (.card_url // "")'
        run: |
          [ -f .sieve/result.json ] || { echo "結果が無い"; exit 0; }
          # 提案でない発言（あいさつや質問）には返事をしない
          [ -n "$(jq -r '.card_url // ""' .sieve/result.json)" ] || { echo "カードなし"; exit 0; }
          # 返事の文面は REPLY_JQ（コモンズの Discord の口調：ひらがな多め・ゆるめ）
          TEXT=$(jq -r "$REPLY_JQ" .sieve/result.json)
          python3 "$SIEVE_TOOLS/safe.py" reply "$CH" "$MSG" "$TEXT" || true

      - name: 受け口から来た提案なら、出した本人にだけ見える1行で、篩のカードを返す
        if: always() && github.event_name == 'repository_dispatch' && github.event.client_payload.token != ''
        env:
          APP_ID: ${{ github.event.client_payload.application_id }}
          TOKEN: ${{ github.event.client_payload.token }}
          REPLY_JQ: '{"小":"ちいさめの直しだね、そのまま入れとくよ 👍","中":"ちゅうくらい！しばらくためしてみよ 🧪","大":"おおきめ！みんなで見てほしいやつ 👀","差し戻す":"これはじぶん用のメモにしとこ 🙏","知識":"ちしきのほうに入れとくね 📚","保留":"いったんおやすみ 💤"} as $t | "🧺 ふるいにかけたよ〜！ " + ($t[.tier // ""] // (.tier // "")) + "\n" + (.summary // "") + "\n" + (.card_url // "")'
        run: |
          [ -f .sieve/result.json ] || { echo "結果が無い"; exit 0; }
          MSG=$(jq -r "$REPLY_JQ" .sieve/result.json)
          jq -n --arg c "$MSG" '{content: $c, flags: 64, allowed_mentions: {parse: []}}' \
            | curl -sS -o /dev/null -w '%{http_code}\n' -X POST -H 'Content-Type: application/json' \
                --data @- "https://discord.com/api/v10/webhooks/$APP_ID/$TOKEN" || true
