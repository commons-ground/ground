# コモンズの Discord の AI（/ai）の本体。各コモンズのリポジトリから呼び出して使う。
# 呼び出し側の例は tools/discord-ai-member/README.md。
name: discord-ai-member

on:
  workflow_call:
    inputs:
      payload:
        description: 受け口から渡された client_payload（JSON の文字）
        type: string
        required: true
      member_dir:
        description: 呼び出し側のリポジトリの中の設定フォルダ（config.json と member.md）
        type: string
        default: discord
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      DISCORD_BOT_TOKEN:
        required: false

permissions:
  contents: read
  issues: write  # 「覚えておく候補」の Issue にためるため

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 14  # Discord の合鍵は15分で切れる
    steps:
      - uses: actions/checkout@v4
        with:
          path: self
      - uses: actions/checkout@v4
        with:
          repository: commons-ground/ground
          path: ground
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install claude-agent-sdk requests
      - name: 返事をする
        env:
          PAYLOAD: ${{ inputs.payload }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MEMBER_DIR: ${{ github.workspace }}/self/${{ inputs.member_dir }}
          PLUGIN_ROOTS: ${{ github.workspace }}/self:${{ github.workspace }}/ground
          MEMORY_CANDIDATES: ${{ runner.temp }}/memory-candidates.md
          USAGE_RECORD: ${{ runner.temp }}/usage.md
          GH_TOKEN: ${{ github.token }}  # gh で GitHub を読むため（書くコマンドは run.py で許していない）
        run: python ground/tools/discord-ai-member/run.py
      - name: 「覚えておく」を候補の Issue にためる（Discord には出さない）
        if: success()
        continue-on-error: true  # ためるのに失敗しても、返事は出ているので失敗の知らせは出さない
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FILE: ${{ runner.temp }}/memory-candidates.md
        run: |
          [ -s "$FILE" ] || exit 0
          gh label create "覚えておく候補" -R "$REPO" --color C5DEF5 --description "AI が覚えたいこと。人が確かめて memory.md に入れる" 2>/dev/null || true
          N=$(gh issue list -R "$REPO" --label "覚えておく候補" --state open --json number -q '.[0].number')
          if [ -z "$N" ]; then
            # 作った Issue の URL をそのまま使う（作った直後の一覧には、まだ出てこないことがある）
            N=$(gh issue create -R "$REPO" --label "覚えておく候補" --title "🧠 覚えておく候補" \
              --body "コモンズのAIが、やりとりから「次から覚えておきたい」と思ったことがここにたまる。core:harvest で拾い、人が確かめてから discord/memory.md に入れる。入れ終わったら閉じてよい（次の候補で新しく開く）。")
          fi
          gh issue comment "$N" -R "$REPO" --body-file "$FILE" > /dev/null
          echo "覚えておく候補を #$N に足した"
      - name: 使われた記録を Issue にためる（スキル名と印だけ）
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FILE: ${{ runner.temp }}/usage.md
        run: |
          [ -s "$FILE" ] || exit 0
          MONTH=$(TZ=Asia/Tokyo date +%Y-%m)
          TITLE="📊 使われた記録 $MONTH"
          gh label create "使われた記録" -R "$REPO" --color EDEDED --description "スキル名と返事の印だけ。中身は残さない" 2>/dev/null || true
          N=$(gh issue list -R "$REPO" --label "使われた記録" --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -z "$N" ]; then
            N=$(gh issue create -R "$REPO" --label "使われた記録" --title "$TITLE" \
              --body "コモンズのAIの返事ごとに、日付・呼ばれ方・使ったスキル・返事の印（発言IDの短いハッシュ）を1行ずつためる。質問と答えの中身は残さない。👍👎 の数は試行の見直しのときに ground の tools/usage/count.py で数える。数は判断の材料の1つで、これだけで定着・取り下げを決めない。月が変わったら閉じてよい。")
          fi
          gh issue comment "$N" -R "$REPO" --body-file "$FILE" > /dev/null
      - name: 失敗したら「考え中…」を直す
        if: failure() || cancelled()
        env:
          PAYLOAD: ${{ inputs.payload }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}  # メンションから来たときは、ボットの鍵で知らせる
        run: python ground/tools/discord-ai-member/run.py --fail
