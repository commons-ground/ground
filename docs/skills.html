<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スキルの一覧｜commons-ground</title>
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#22201c;--sub:#5f5b53;--line:#e3dfd6;--base:#0f6e56;--base-bg:#e1f5ee;--own:#534ab7;--own-bg:#eeedfe;--auto:#854f0b;--auto-bg:#faeeda;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--card:#24231f;--ink:#ece9e2;--sub:#b4b0a6;--line:#3a3833;--base:#5dcaa5;--base-bg:#0d3b30;--own:#afa9ec;--own-bg:#2c2858;--auto:#ef9f27;--auto-bg:#3d2a0c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.7;font-size:15px}
main{max-width:1100px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:26px;margin:0 0 8px;font-weight:600}
.lead{color:var(--sub);margin:0 0 20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
input,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input{flex:1;min-width:220px}
.count{color:var(--sub);font-size:13px;margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card h2{font-size:16px;margin:0 0 4px;font-weight:600}
.card h2 a{color:inherit;text-decoration:none}
.card h2 a:hover{text-decoration:underline}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--base-bg);color:var(--base)}
.tag.wine{background:var(--own-bg);color:var(--own)}
.tag.trial{background:var(--auto-bg);color:var(--auto)}
.desc{color:var(--sub);font-size:13.5px;margin:0}
.err{color:var(--auto)}
a{color:var(--base)}
</style>
</head>
<body>
<main>
<h1>スキルの一覧</h1>
<p class="lead">コモンズで共有しているスキル（AI への作業手順書）の一覧です。開いたときに GitHub から最新を読み込みます。中身は各スキルの名前から開けます。<a href="./">入口のページへ</a></p>
<div class="bar">
  <input id="q" type="search" placeholder="名前・説明で探す（例：議事録、補助金、べと病）">
  <select id="repo"><option value="">すべてのコモンズ</option><option value="ground">土台（ground）</option><option value="winegrowers">ワイン生産者（winegrowers）</option></select>
  <select id="plugin"><option value="">すべてのプラグイン</option></select>
</div>
<p class="count" id="count">読み込んでいます…</p>
<div class="grid" id="list"></div>
</main>
<script>
// 生成のための仕組み（workflow やコミット）を増やさないよう、開いたときにリポジトリを読む。
// GitHub の API は木（ファイル一覧）を取る1回だけ。中身は raw から読む。
const REPOS = ["ground", "winegrowers"];
const RAW = (r, p) => `https://raw.githubusercontent.com/commons-ground/${r}/main/${p}`;
let items = [];

function front(md) {
  const m = md.match(/^---\n([\s\S]*?)\n---/);
  const o = {};
  if (!m) return o;
  for (const line of m[1].split("\n")) {
    const k = line.match(/^(\w+):\s*(.*)$/);
    if (k) o[k[1]] = k[2].replace(/^["']|["']$/g, "");
  }
  return o;
}

async function loadRepo(repo) {
  const tree = await (await fetch(`https://api.github.com/repos/commons-ground/${repo}/git/trees/main?recursive=1`)).json();
  if (!tree.tree) throw new Error(tree.message || "読み込めませんでした");
  const skills = tree.tree.filter((t) => /^plugins\/[^/]+\/skills\/[^/]+\/SKILL\.md$/.test(t.path));
  const plugins = {};
  await Promise.all(
    [...new Set(skills.map((s) => s.path.split("/")[1]))].map(async (p) => {
      try { plugins[p] = await (await fetch(RAW(repo, `plugins/${p}/.claude-plugin/plugin.json`))).json(); } catch { plugins[p] = {}; }
    }),
  );
  return Promise.all(
    skills.map(async (s) => {
      const [, plugin, , dir] = s.path.split("/");
      const fm = front(await (await fetch(RAW(repo, s.path))).text());
      return {
        repo, plugin, pluginName: plugins[plugin]?.displayName || plugin, version: plugins[plugin]?.version || "",
        name: fm.name || dir, description: fm.description || "",
        url: `https://github.com/commons-ground/${repo}/blob/main/${s.path}`,
      };
    }),
  );
}

async function trials() {
  try {
    const md = await (await fetch(RAW("ground", "docs/trials.md"))).text();
    return md.split("\n").filter((l) => l.includes("試行中"));
  } catch { return []; }
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const repo = document.getElementById("repo").value;
  const plugin = document.getElementById("plugin").value;
  const shown = items.filter((i) =>
    (!repo || i.repo === repo) && (!plugin || `${i.repo}:${i.plugin}` === plugin) &&
    (!q || `${i.name} ${i.description} ${i.pluginName}`.toLowerCase().includes(q)));
  document.getElementById("count").textContent = `${shown.length} 件（全 ${items.length} 件）`;
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  document.getElementById("list").innerHTML = shown.map((i) => `
    <div class="card">
      <h2><a href="${i.url}" target="_blank" rel="noopener">${esc(i.name)}</a></h2>
      <div class="meta">
        <span class="tag ${i.repo === "winegrowers" ? "wine" : ""}">${i.repo === "winegrowers" ? "ワイン生産者" : "土台"}</span>
        <span class="tag ${i.repo === "winegrowers" ? "wine" : ""}">${esc(i.pluginName)}${i.version ? " " + esc(i.version) : ""}</span>
        ${i.trial ? '<span class="tag trial">試行中</span>' : ""}
      </div>
      <p class="desc">${esc(i.description)}</p>
    </div>`).join("");
}

(async () => {
  try {
    const [lists, trialLines] = await Promise.all([Promise.all(REPOS.map(loadRepo)), trials()]);
    items = lists.flat().sort((a, b) => (a.repo + a.plugin + a.name).localeCompare(b.repo + b.plugin + b.name));
    for (const i of items) i.trial = trialLines.some((l) => l.includes(`plugins/${i.plugin}/skills/${i.name}`));
    const sel = document.getElementById("plugin");
    for (const k of [...new Set(items.map((i) => `${i.repo}:${i.plugin}`))]) {
      const it = items.find((i) => `${i.repo}:${i.plugin}` === k);
      sel.insertAdjacentHTML("beforeend", `<option value="${k}">${it.pluginName}（${it.repo}）</option>`);
    }
    render();
  } catch (e) {
    document.getElementById("count").innerHTML = `<span class="err">読み込めませんでした（${e.message}）。少し待って開き直してください。</span>`;
  }
  for (const id of ["q", "repo", "plugin"]) document.getElementById(id).addEventListener("input", render);
})();
</script>
</body>
</html>
